name: regenerate WHOOP goldens
# Manual only. Rebuilds test/fixtures/whoop_freeze/*.json under all three
# zones the golden test covers and uploads them as an artifact, for a
# DELIBERATE algorithm change (a kAlgoVersion bump that moves WHOOP output).
# Review the diff before committing it — the golden exists so output never
# changes by accident.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Regenerate under UTC, +05:30 and -04:00
        # Logs are kept in the pushed branch (artifact and log downloads are
        # blocked from the cloud session), and a failure still pushes them.
        run: |
          set -o pipefail
          rc=0
          TZ=UTC GENERATE_GOLDEN=1 flutter test --concurrency=1 test/whoop_freeze_golden_test.dart 2>&1 | tee regen_utc.log || rc=1
          TZ=Asia/Kolkata GENERATE_GOLDEN=1 flutter test --concurrency=1 test/whoop_freeze_golden_test.dart 2>&1 | tee regen_ist.log || rc=1
          TZ=America/New_York GENERATE_GOLDEN=1 flutter test --concurrency=1 test/whoop_freeze_golden_test.dart 2>&1 | tee regen_ny.log || rc=1
          TZ=UTC GENERATE_GOLDEN=1 flutter test --concurrency=1 test/two_device_fixture_test.dart 2>&1 | tee regen_two.log || rc=1
          echo "rc=$rc" > regen_status.txt
      # Pushed to a side branch, never to main: a human (or the session that
      # asked for it) reviews the diff and copies it over deliberately.
      - name: Push the regenerated goldens to goldens-regen-<branch>
        run: |
          git config user.name "goldens-bot"
          git config user.email "goldens-bot@users.noreply.github.com"
          git checkout -B "goldens-regen-${GITHUB_REF_NAME}"
          git add -f test/fixtures/whoop_freeze/*.json test/fixtures/two_device_day_expected.json regen_*.log regen_status.txt
          git commit -m "Regenerated WHOOP freeze goldens from ${GITHUB_SHA::8}" || echo "no change"
          git push -f origin "goldens-regen-${GITHUB_REF_NAME}"
